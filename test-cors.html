<!DOCTYPE html>
<html>
<head>
    <title>Ollama Cloud CORS Test</title>
</head>
<body>
    <h1>Ollama Cloud API CORS Test</h1>
    <button onclick="testAPI()">Test API</button>
    <pre id="result"></pre>

    <script>
        async function testAPI() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Testing...';

            try {
                const response = await fetch('https://ollama.com/api/tags', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer c111d6606b5a49bd89c27cd1b32994ee.ysOGoyvLtM0SaHtpOk3HSoYb',
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    resultEl.textContent = '✅ SUCCESS!\n\n' + JSON.stringify(data, null, 2);
                } else {
                    resultEl.textContent = '❌ HTTP Error: ' + response.status + '\n' + response.statusText;
                }
            } catch (error) {
                resultEl.textContent = '❌ ERROR:\n' + error.message + '\n\nThis is likely a CORS error.\n\nCheck browser console for details.';
                console.error('Detailed error:', error);
            }
        }
    </script>
</body>
</html>
